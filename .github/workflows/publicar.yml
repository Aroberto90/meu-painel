# Publica o app no GitHub Pages e atualiza as notícias de hora em hora.
name: Publicar
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Montar o site
        run: |
          mkdir site
          cp index.html app.js dados.js estilo.css sw.js manifest.webmanifest site/
          cp -r icones site/
          # versão do cache = este commit (o iPhone baixa a versão nova sozinho)
          sed -i "s/__VERSAO__/${GITHUB_SHA::8}/" site/sw.js
      - name: Buscar notícias
        run: node ferramentas/noticias.js site/noticias.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
